[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultriever"
version = "0.1.1"
description = "Retrieve secrets in an ARN-like way from different vaults seamlessly, compatible with pydantic-settings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Douglas Trajano" }]
requires-python = ">=3.10"
keywords = ["secrets", "pydantic", "pydantic-settings", "aws", "databricks", "vault"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/DougTrajano/vaultriever"
Repository = "https://github.com/DougTrajano/vaultriever"
Issues = "https://github.com/DougTrajano/vaultriever/issues"

[project.optional-dependencies]
aws = ["boto3>=1.26.0"]
databricks = ["databricks-sdk>=0.20.0"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-tooltips>=0.1.0",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-llmstxt>=0.2.0",
]

[dependency-groups]
dev = [
    "boto3>=1.26.0",
    "boto3-stubs[secretsmanager]>=1.26.0",
    "databricks-sdk>=0.20.0",
    "moto[secretsmanager]>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vaultriever"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vaultriever --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
# asserts, hardcoded test secrets, and lowercase env vars (the mixin exports
# field names verbatim) are fine in tests
"tests/*" = ["S101", "S105", "S106", "SIM112"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
strict = true
files = ["vaultriever", "tests"]

[[tool.mypy.overrides]]
module = ["databricks.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
